<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin sign in - {{ brand }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><span class="brand">{{ brand }}</span><span class="evname">Admin</span></header>
<main>
{% if msg %}<p class="msg" role="alert">{{ msg }}</p>{% endif %}
<section class="card"><h1>Admin sign in</h1>
<form method="post"><label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button></form></section>
</main></body></html>
