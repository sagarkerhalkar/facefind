<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b5ce6">
<title>Sign in - {{ brand }}</title>
<script src="{{ url_for('static', filename='theme.js') }}?v={{ static_v('theme.js') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}?v={{ static_v('admin.css') }}">
<link rel="stylesheet" href="{{ url_for('brand_theme') }}?v={{ studio.v }}">
</head>
<body><div class="login"><section class="box">
<span class="mark">{% if studio.logo %}<img src="{{ url_for('brand_logo') }}?v={{ studio.v }}" alt="{{ brand }}">{% else %}{{ brand }}{% endif %}</span>
<h1>Staff sign in</h1><p class="hint">Albums, guests and settings.</p>
{% if msg %}<p class="msg" role="alert">{{ msg }}</p>{% endif %}
<form method="post">
<label for="username">User name</label>
<input id="username" name="username" type="text" autocomplete="username" placeholder="Leave empty if you are the owner">
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit" class="wide accent">Sign in</button></form></section></div>
</body></html>
